<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavix · 인식률 리포트</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #080C14;
  --bg2:     #0E1520;
  --bg3:     #151D2E;
  --bg4:     #1C2638;
  --border:  #1F2E45;
  --accent:  #00E5B0;
  --accent2: #0097FF;
  --warn:    #F5A623;
  --danger:  #FF4D4D;
  --text:    #E8EDF5;
  --muted:   #5A7294;
  --dim:     #344B66;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  line-height:1.6;
  min-height:100vh;
}

/* ── SCANLINE overlay ── */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,229,176,0.012) 2px,rgba(0,229,176,0.012) 4px);
  pointer-events:none;
  z-index:0;
}

/* ── NAV ── */
nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 48px;
  background:rgba(8,12,20,0.85);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.nav-logo{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;font-weight:600;
  letter-spacing:0.06em;
  color:var(--accent);
}
.nav-logo span{color:var(--text);font-weight:300}
.nav-meta{font-size:11px;color:var(--muted);font-family:'Space Grotesk',sans-serif;letter-spacing:0.1em}
.nav-tabs{display:flex;gap:4px}
.nav-tab{
  padding:6px 14px;border-radius:6px;
  font-size:12px;font-family:'Space Grotesk',sans-serif;
  cursor:pointer;transition:all 0.15s;
  border:1px solid transparent;
  color:var(--muted);
  background:none;
}
.nav-tab:hover{color:var(--text);background:var(--bg3)}
.nav-tab.active{color:var(--accent);border-color:rgba(0,229,176,0.3);background:rgba(0,229,176,0.07)}

/* ── HERO ── */
.hero{
  position:relative;
  padding:64px 48px 48px;
  overflow:hidden;
}
.hero::after{
  content:'';
  position:absolute;
  top:-120px;right:-80px;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(0,229,176,0.06) 0%,transparent 65%);
  pointer-events:none;
}
.hero-eyebrow{
  font-family:'Space Grotesk',sans-serif;
  font-size:11px;letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.hero-eyebrow::before{
  content:'';width:24px;height:1px;background:var(--accent);
}
.hero h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:42px;font-weight:700;
  letter-spacing:-0.03em;
  line-height:1.1;
  margin-bottom:8px;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-sub{font-size:13px;color:var(--muted);margin-bottom:40px}

/* ── SCORECARD ── */
.scorecards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:0;
}
.scorecard{
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px 28px;
  position:relative;
  overflow:hidden;
  transition:border-color 0.2s,transform 0.2s;
  cursor:pointer;
}
.scorecard:hover{border-color:rgba(0,229,176,0.4);transform:translateY(-2px)}
.scorecard.active-unit{border-color:var(--accent);background:rgba(0,229,176,0.04)}
.scorecard::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  opacity:0.6;
}
.sc-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
  display:flex;align-items:center;gap:6px;
}
.sc-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.sc-big{
  font-family:'Space Grotesk',sans-serif;
  font-size:48px;font-weight:700;
  letter-spacing:-0.03em;
  color:var(--accent);
  line-height:1;
  margin-bottom:4px;
}
.sc-big.warn{color:var(--warn)}
.sc-sub{font-size:11px;color:var(--muted);font-family:'Space Grotesk',sans-serif}
.sc-stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:8px;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--border);
}
.sc-stat-label{font-size:10px;color:var(--dim);font-family:'Space Grotesk',sans-serif;letter-spacing:0.05em}
.sc-stat-val{font-size:13px;font-family:'Space Grotesk',sans-serif;font-weight:500;color:var(--text)}

/* ── SECTION ── */
main{max-width:1280px;margin:0 auto;padding:0 48px 80px}
.section{margin-top:56px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.section-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);
  display:flex;align-items:center;gap:10px;
}
.section-title::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}

/* ── UNIT SELECTOR ── */
.unit-tabs{display:flex;gap:6px}
.unit-tab{
  padding:6px 16px;border-radius:8px;
  font-size:12px;font-family:'Space Grotesk',sans-serif;font-weight:500;
  cursor:pointer;transition:all 0.15s;
  border:1px solid var(--border);
  color:var(--muted);background:none;
}
.unit-tab:hover{color:var(--text);background:var(--bg3)}
.unit-tab.active{color:var(--accent);border-color:rgba(0,229,176,0.4);background:rgba(0,229,176,0.07)}

/* ── CHART CONTAINER ── */
.chart-wrap{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:28px;
  position:relative;
}
.chart-inner{position:relative;height:280px}
.chart-legend{
  display:flex;gap:20px;margin-bottom:16px;
  flex-wrap:wrap;
}
.legend-item{
  display:flex;align-items:center;gap:6px;
  font-size:11px;font-family:'Space Grotesk',sans-serif;color:var(--muted);
}
.legend-dot{width:8px;height:8px;border-radius:2px}

/* ── MINI CHARTS GRID ── */
.mini-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:12px;margin-top:12px;
}
.mini-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:16px 18px;
}
.mini-label{font-size:10px;color:var(--muted);font-family:'Space Grotesk',sans-serif;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:8px}
.mini-val{font-size:22px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--accent)}
.mini-sub{font-size:10px;color:var(--dim);margin-top:2px;font-family:'Space Grotesk',sans-serif}

/* ── TABLE ── */
.table-wrap{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;
}
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);padding:12px 16px;
  border-bottom:1px solid var(--border);
  text-align:right;background:var(--bg3);
}
.data-table th:first-child{text-align:left}
.data-table td{
  padding:10px 16px;
  border-bottom:1px solid rgba(31,46,69,0.5);
  font-family:'Space Grotesk',sans-serif;font-size:12px;
  text-align:right;color:var(--text);
  transition:background 0.1s;
}
.data-table td:first-child{text-align:left;color:var(--muted)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg3)}
.data-table .perfect{color:var(--accent)}
.data-table .warn-cell{color:var(--warn)}
.data-table .pill{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:10px;font-weight:600;
}
.pill-good{background:rgba(0,229,176,0.12);color:var(--accent)}
.pill-warn{background:rgba(245,166,35,0.12);color:var(--warn)}
.pill-bad{background:rgba(255,77,77,0.12);color:var(--danger)}

/* ── LOADING ── */
#loading{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;transition:opacity 0.4s;
}
.load-logo{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;letter-spacing:0.2em;color:var(--accent);
  margin-bottom:20px;text-transform:uppercase;
}
.load-bar-bg{width:200px;height:2px;background:var(--bg4);border-radius:2px;overflow:hidden}
.load-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width 0.3s}
.load-msg{font-size:11px;color:var(--dim);margin-top:10px;font-family:'Space Grotesk',sans-serif}

/* ── FOOTER ── */
footer{
  border-top:1px solid var(--border);
  padding:20px 48px;
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--dim);
  font-family:'Space Grotesk',sans-serif;letter-spacing:0.06em;
}

/* ── RESPONSIVE ── */
@media(max-width:1100px){
  .scorecards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .scorecards{grid-template-columns:1fr}
  nav,main,.hero{padding-left:20px;padding-right:20px}
  .hero h1{font-size:28px}
  .mini-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="load-logo">Kavix · Recognition Report</div>
  <div class="load-bar-bg"><div class="load-bar" id="loadBar"></div></div>
  <div class="load-msg" id="loadMsg">data.md 파싱 중...</div>
</div>

<!-- Nav -->
<nav>
  <div class="nav-logo">KAVIX <span>· Recognition Report</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="scrollToSection('summary')">Overview</button>
    <button class="nav-tab" onclick="scrollToSection('trend')">Trend</button>
    <button class="nav-tab" onclick="scrollToSection('detail')">Detail</button>
  </div>
  <div class="nav-meta" id="navMeta">— / — ~ — / —</div>
</nav>

<!-- Hero + Scorecards -->
<div class="hero" id="summary">
  <div style="max-width:1280px;margin:0 auto">
    <div class="hero-eyebrow">Humax Mobility · 영상처리·AI-PAS팀</div>
    <h1>차량 <em>인식률</em> 종합 리포트</h1>
    <p class="hero-sub" id="heroSub">데이터 로딩 중...</p>
    <div class="scorecards" id="scorecards"></div>
  </div>
</div>

<main>
  <!-- Trend Chart -->
  <div class="section" id="trend">
    <div class="section-head">
      <div class="section-title">일별 인식률 추이</div>
      <div class="unit-tabs" id="trendTabs"></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-legend" id="chartLegend"></div>
      <div class="chart-inner"><canvas id="trendChart"></canvas></div>
    </div>
    <div class="mini-grid" id="miniGrid"></div>
  </div>

  <!-- Detail Table -->
  <div class="section" id="detail">
    <div class="section-head">
      <div class="section-title">상세 데이터</div>
      <div class="unit-tabs" id="detailTabs"></div>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="detailTable"></table>
    </div>
  </div>
</main>

<footer>
  <span>HP-NVD-Model · yolov8n-640-Tr10280 · 휴맥스모빌리티</span>
  <span id="footerDate">—</span>
</footer>

<script>
// ── DATA PARSER ──────────────────────────────────────────────
function parseMarkdownTable(text) {
  const units = {};
  let currentUnit = null;

  const lines = text.split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('## ')) {
      currentUnit = trimmed.replace('## ', '').trim();
      units[currentUnit] = [];
      continue;
    }
    if (!currentUnit) continue;
    if (trimmed.startsWith('|') && !trimmed.startsWith('| --') && !trimmed.startsWith('| 일시')) {
      const cols = trimmed.split('|').map(c => c.trim()).filter(Boolean);
      if (cols.length >= 14 && cols[0].includes('/')) {
        if (cols[6] === '-') {
          units[currentUnit].push({
            date: cols[0], os: cols[1], sw: cols[2], model: cols[3],
            thresh: parseFloat(cols[4]), iou: parseFloat(cols[5]), missing: true,
          });
          continue;
        }
        const row = {
          date:   cols[0],
          os:     cols[1],
          sw:     cols[2],
          model:  cols[3],
          thresh: parseFloat(cols[4]),
          iou:    parseFloat(cols[5]),
          gt:     parseInt(cols[6]),
          tp:     parseInt(cols[7]),
          fp:     parseInt(cols[8]),
          fn:     parseInt(cols[9]),
          P:      parseFloat(cols[10]),
          R:      parseFloat(cols[11]),
          F1:     parseFloat(cols[12]),
          A:      parseFloat(cols[13]),
        };
        units[currentUnit].push(row);
      }
    }
  }
  return units;
}

// ── COMPUTE TOTALS ──────────────────────────────────────────
function validRows(rows) { return rows.filter(r => !r.missing); }

function computeTotal(rows) {
  const valid = validRows(rows);
  const gt  = valid.reduce((s,r) => s + r.gt,  0);
  const tp  = valid.reduce((s,r) => s + r.tp,  0);
  const fp  = valid.reduce((s,r) => s + r.fp,  0);
  const fn  = valid.reduce((s,r) => s + r.fn,  0);
  const P   = tp / (tp + fp) * 100;
  const R   = tp / (tp + fn) * 100;
  const F1  = 2 * P * R / (P + R);
  const A   = tp / (tp + fp + fn) * 100;
  return { gt, tp, fp, fn,
    P:  P.toFixed(2),
    R:  R.toFixed(2),
    F1: F1.toFixed(2),
    A:  A.toFixed(2),
    days: valid.length };
}

// ── COLORS ──────────────────────────────────────────────────
const UNIT_COLORS = [
  { line:'#00E5B0', fill:'rgba(0,229,176,0.08)', label:'전면-입구' },
  { line:'#0097FF', fill:'rgba(0,151,255,0.08)', label:'후면-입구' },
  { line:'#F5A623', fill:'rgba(245,166,35,0.08)', label:'출구' },
  { line:'#C77DFF', fill:'rgba(199,125,255,0.08)', label:'KT&G 정문' },
];

// ── RENDER SCORECARDS ────────────────────────────────────────
function renderScorecards(units) {
  const keys   = Object.keys(units);
  const wrap   = document.getElementById('scorecards');
  wrap.innerHTML = '';

  keys.forEach((key, i) => {
    const total = computeTotal(units[key]);
    const col   = UNIT_COLORS[i % UNIT_COLORS.length];
    const aVal  = parseFloat(total.A);
    const bigCls = aVal >= 99.5 ? '' : aVal >= 98 ? 'warn' : 'danger';

    const card = document.createElement('div');
    card.className = 'scorecard' + (i === 0 ? ' active-unit' : '');
    card.dataset.idx = i;
    card.innerHTML = `
      <div class="sc-label">
        <span class="sc-dot" style="background:${col.line}"></span>
        ${key}
      </div>
      <div class="sc-big ${bigCls}">${total.R}<span style="font-size:18px;font-weight:300">%</span></div>
      <div class="sc-sub">종합 Recall · ${total.days}일 데이터</div>
      <div class="sc-stats">
        <div>
          <div class="sc-stat-label">GT</div>
          <div class="sc-stat-val">${total.gt.toLocaleString()}</div>
        </div>
        <div>
          <div class="sc-stat-label">FP</div>
          <div class="sc-stat-val" style="color:${total.fp>10?'var(--warn)':'var(--text)'}">${total.fp}</div>
        </div>
        <div>
          <div class="sc-stat-label">FN</div>
          <div class="sc-stat-val" style="color:${total.fn>10?'var(--warn)':'var(--text)'}">${total.fn}</div>
        </div>
        <div>
          <div class="sc-stat-label">Precision</div>
          <div class="sc-stat-val">${total.P}%</div>
        </div>
        <div>
          <div class="sc-stat-label">F1</div>
          <div class="sc-stat-val">${total.F1}%</div>
        </div>
         <div>
          <div class="sc-stat-label">Accuracy</div>
          <div class="sc-stat-val">${total.A}%</div>
        </div>
      </div>`;
    wrap.appendChild(card);
  });
}

// ── TREND CHART ──────────────────────────────────────────────
let trendChart = null;
let allUnits   = {};
let activeUnits = new Set();

function getAllDates(units) {
  const set = new Set();
  Object.values(units).forEach(rows => validRows(rows).forEach(r => set.add(r.date)));
  return [...set].sort((a,b) => {
    const [am,ad] = a.split('/').map(Number);
    const [bm,bd] = b.split('/').map(Number);
    return am !== bm ? am - bm : ad - bd;
  });
}

function renderTrendChart(units) {
  const keys  = Object.keys(units);
  const dates = getAllDates(units);

  // tabs
  const tabsEl = document.getElementById('trendTabs');
  tabsEl.innerHTML = '<button class="unit-tab active" data-unit="ALL" onclick="toggleUnit(this)">전체</button>';
  keys.forEach((k,i) => {
    const col = UNIT_COLORS[i];
    tabsEl.innerHTML += `<button class="unit-tab" data-unit="${k}" onclick="toggleUnit(this)" style="--uc:${col.line}">${UNIT_COLORS[i].label}</button>`;
  });

  // legend
  const legendEl = document.getElementById('chartLegend');
  legendEl.innerHTML = '';
  keys.forEach((k,i) => {
    const col = UNIT_COLORS[i];
    legendEl.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${col.line}"></div>${k}</div>`;
  });

  const datasets = keys.map((key,i) => {
    const col    = UNIT_COLORS[i];
    const map    = {};
    validRows(units[key]).forEach(r => { map[r.date] = r.R; });
    return {
      label: key,
      data: dates.map(d => map[d] ?? null),
      borderColor: col.line,
      backgroundColor: col.fill,
      borderWidth: 2,
      pointRadius: 4,
      pointHoverRadius: 6,
      pointBackgroundColor: col.line,
      tension: 0.35,
      fill: false,
      spanGaps: true,
    };
  });

  const ctx = document.getElementById('trendChart').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor:'rgba(14,21,32,0.95)',
          borderColor:'rgba(0,229,176,0.3)',
          borderWidth:1,
          titleColor:'#E8EDF5',
          bodyColor:'#5A7294',
          padding:12,
          titleFont:{ family:'Space Grotesk', size:12 },
          bodyFont:{ family:'Space Grotesk', size:11 },
          callbacks:{
            label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y !== null ? ctx.parsed.y.toFixed(2)+'%' : '—'}`
          }
        }
      },
      scales: {
        x:{
          grid:{ color:'rgba(31,46,69,0.5)' },
          ticks:{ color:'#5A7294', font:{ family:'Space Grotesk', size:10 }, maxRotation:45 },
          border:{ color:'var(--border)' }
        },
        y:{
          min: 92,
          max: 100.2,
          grid:{ color:'rgba(31,46,69,0.5)' },
          ticks:{
            color:'#5A7294',
            font:{ family:'Space Grotesk', size:10 },
            callback: v => v.toFixed(1)+'%'
          },
          border:{ color:'var(--border)' }
        }
      }
    }
  });
}

function toggleUnit(btn) {
  const tabs = document.querySelectorAll('#trendTabs .unit-tab');
  const unit = btn.dataset.unit;
  if (unit === 'ALL') {
    tabs.forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    trendChart.data.datasets.forEach(ds => { ds.hidden = false; });
  } else {
    document.querySelector('[data-unit="ALL"]').classList.remove('active');
    btn.classList.toggle('active');
    const activeSets = new Set([...tabs].filter(t => t.classList.contains('active')).map(t => t.dataset.unit));
    if (activeSets.size === 0) {
      tabs[0].classList.add('active');
      trendChart.data.datasets.forEach(ds => { ds.hidden = false; });
    } else {
      trendChart.data.datasets.forEach(ds => { ds.hidden = !activeSets.has(ds.label); });
    }
  }
  trendChart.update();
}

// ── MINI STATS ───────────────────────────────────────────────
function renderMiniGrid(units) {
  const unitCount = Object.keys(units).length;
  const allRows = Object.values(units).flat();
  const valid   = validRows(allRows);
  const total   = computeTotal(allRows);
  const totalGT = valid.reduce((s,r) => s + r.gt, 0);
  const totalFP = valid.reduce((s,r) => s + r.fp, 0);
  const totalFN = valid.reduce((s,r) => s + r.fn, 0);
  const perfect = valid.filter(r => r.fp === 0 && r.fn === 0).length;

  document.getElementById('miniGrid').innerHTML = `
    <div class="mini-card">
      <div class="mini-label">전체 종합 Recall</div>
      <div class="mini-val">${total.R}%</div>
      <div class="mini-sub">${unitCount}개 유닛 합산</div>
    </div>
    <div class="mini-card">
      <div class="mini-label">총 GT 프레임</div>
      <div class="mini-val" style="color:var(--accent2)">${totalGT.toLocaleString()}</div>
      <div class="mini-sub">전체 검증 대상</div>
    </div>
    <div class="mini-card">
      <div class="mini-label">총 FP + FN</div>
      <div class="mini-val" style="color:${totalFP+totalFN>50?'var(--warn)':'var(--accent)'}">${totalFP + totalFN}</div>
      <div class="mini-sub">FP ${totalFP} · FN ${totalFN}</div>
    </div>
    <div class="mini-card">
      <div class="mini-label">완벽 인식 일수</div>
      <div class="mini-val" style="color:var(--accent)">${perfect}</div>
      <div class="mini-sub">FP=0 & FN=0 달성</div>
    </div>`;
}

// ── DETAIL TABLE ─────────────────────────────────────────────
let currentDetailUnit = 0;

function renderDetailTable(units, unitIdx) {
  const keys = Object.keys(units);
  currentDetailUnit = unitIdx;

  // tabs
  const tabsEl = document.getElementById('detailTabs');
  tabsEl.innerHTML = '';
  keys.forEach((k,i) => {
    const btn = document.createElement('button');
    btn.className = 'unit-tab' + (i === unitIdx ? ' active' : '');
    btn.textContent = UNIT_COLORS[i].label;
    btn.onclick = () => renderDetailTable(units, i);
    tabsEl.appendChild(btn);
  });

  const rows = units[keys[unitIdx]];
  const total = computeTotal(rows);

  const thead = `<thead><tr>
    <th>일시</th><th>S/W</th><th>임계값</th><th>GT</th>
    <th>TP</th><th>FP</th><th>FN</th>
    <th>P (%)</th><th>R (%)</th><th>F1 (%)</th><th>A (%)</th>
  </tr></thead>`;

  const tbodyRows = rows.map(r => {
    if (r.missing) {
      return `<tr>
        <td>${r.date}</td>
        <td style="font-size:11px;color:var(--dim)">${r.sw}</td>
        <td>${r.thresh}</td>
        <td colspan="8" style="text-align:center;color:var(--dim)">— 데이터 없음 —</td>
      </tr>`;
    }
    const aCls = r.A >= 99.9 ? 'perfect' : r.A >= 99.5 ? '' : 'warn-cell';
    const pill = r.A >= 99.9 ? '<span class="pill pill-good">PERFECT</span>'
               : r.A >= 99.0 ? '<span class="pill pill-good">GOOD</span>'
               : r.A >= 97.0 ? '<span class="pill pill-warn">WARN</span>'
               :                '<span class="pill pill-bad">POOR</span>';
    return `<tr>
      <td>${r.date}</td>
      <td style="font-size:11px;color:var(--dim)">${r.sw}</td>
      <td>${r.thresh}</td>
      <td>${r.gt.toLocaleString()}</td>
      <td>${r.tp.toLocaleString()}</td>
      <td style="color:${r.fp>5?'var(--warn)':r.fp>0?'var(--text)':'var(--dim)'}">${r.fp}</td>
      <td style="color:${r.fn>5?'var(--warn)':r.fn>0?'var(--text)':'var(--dim)'}">${r.fn}</td>
      <td>${r.P}</td>
      <td>${r.R}</td>
      <td>${r.F1}</td>
      <td class="${aCls}">${r.A} ${pill}</td>
    </tr>`;
  }).join('');

  const tfootRow = `<tfoot><tr style="background:var(--bg3)">
    <td colspan="3" style="font-weight:600;color:var(--accent);font-family:'Space Grotesk',sans-serif">합계 / 평균 (${total.days}일)</td>
    <td style="font-weight:600">${total.gt.toLocaleString()}</td>
    <td style="font-weight:600">${total.tp.toLocaleString()}</td>
    <td style="font-weight:600;color:${total.fp>20?'var(--warn)':'var(--text)'}">${total.fp}</td>
    <td style="font-weight:600;color:${total.fn>20?'var(--warn)':'var(--text)'}">${total.fn}</td>
    <td style="font-weight:600;color:var(--accent)">${total.P}</td>
    <td style="font-weight:600;color:var(--accent)">${total.R}</td>
    <td style="font-weight:600;color:var(--accent)">${total.F1}</td>
    <td style="font-weight:600;color:var(--accent)">${total.A}</td>
  </tr></tfoot>`;

  document.getElementById('detailTable').innerHTML = thead + '<tbody>' + tbodyRows + '</tbody>' + tfootRow;
}

// ── SCROLL NAV ───────────────────────────────────────────────
function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior:'smooth' });
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

// ── MAIN: fetch data.md ──────────────────────────────────────
async function init() {
  const loadBar = document.getElementById('loadBar');
  const loadMsg = document.getElementById('loadMsg');

  loadBar.style.width = '20%';
  loadMsg.textContent = 'data.md 로드 중...';

  let text = '';
  try {
    const res = await fetch('./data.md');
    if (!res.ok) throw new Error('fetch failed');
    text = await res.text();
    loadBar.style.width = '50%';
    loadMsg.textContent = '데이터 파싱 중...';
  } catch(e) {
    // fallback: embedded sample data
    text = EMBEDDED_DATA;
    loadMsg.textContent = '(내장 데이터 사용)';
  }

  await new Promise(r => setTimeout(r, 300));
  loadBar.style.width = '75%';

  allUnits = parseMarkdownTable(text);
  const keys = Object.keys(allUnits);

  // date range for nav & hero
  const allDates = Object.values(allUnits).flat().map(r => r.date);
  const minDate  = allDates.reduce((a,b) => a < b ? a : b);
  const maxDate  = allDates.reduce((a,b) => a > b ? a : b);
  document.getElementById('navMeta').textContent = `5월 ~ 6월 2025`;
  document.getElementById('heroSub').textContent = `${minDate} ~ ${maxDate} · ${keys.length}개 유닛`;
  document.getElementById('footerDate').textContent = `Report generated: ${new Date().toLocaleDateString('ko-KR')}`;

  loadBar.style.width = '90%';
  loadMsg.textContent = '차트 렌더링 중...';

  renderScorecards(allUnits);
  renderTrendChart(allUnits);
  renderMiniGrid(allUnits);
  renderDetailTable(allUnits, 0);

  await new Promise(r => setTimeout(r, 200));
  loadBar.style.width = '100%';

  const loadEl = document.getElementById('loading');
  loadEl.style.opacity = '0';
  setTimeout(() => { loadEl.style.display = 'none'; }, 400);
}
